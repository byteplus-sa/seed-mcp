apiVersion: v1
kind: Service
metadata:
  name: {{ include "seed-mcp.name" . }}
  labels:
    {{- include "seed-mcp.selector" . | nindent 4 }}
  annotations:
    service.beta.kubernetes.io/volcengine-loadbalancer-subnet-id: {{ .Values.service.subnetId | quote }}
    service.beta.kubernetes.io/volcengine-loadbalancer-address-type: "PUBLIC"
    service.beta.kubernetes.io/volcengine-loadbalancer-isp-type: "BGP"
    service.beta.kubernetes.io/volcengine-loadbalancer-billing-type: "2"
    service.beta.kubernetes.io/volcengine-loadbalancer-eip-billing-type: "3"
    service.beta.kubernetes.io/volcengine-loadbalancer-bandwidth: {{ .Values.service.bandwidthMbps | quote }}
    service.beta.kubernetes.io/volcengine-loadbalancer-spec: "small_1"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.sourceRanges | nindent 4 }}
  selector:
    {{- include "seed-mcp.selector" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP

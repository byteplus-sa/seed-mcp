{{- if and .Values.temporaryUpload.enabled (eq .Values.temporaryUpload.credentialsMode "irsa") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.temporaryUpload.irsa.serviceAccountName | quote }}
  labels:
    {{- include "seed-mcp.selector" . | nindent 4 }}
# Explicit projection below, not automatic API-token or webhook injection.
automountServiceAccountToken: false
{{- end }}

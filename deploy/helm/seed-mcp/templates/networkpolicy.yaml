{{- if eq .Values.service.mode "apig-staging" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "seed-mcp.name" . }}-ingress
  labels:
    {{- include "seed-mcp.selector" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "seed-mcp.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.service.sourceRanges }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8443
{{- end }}

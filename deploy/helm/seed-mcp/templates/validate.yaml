{{- if contains "API_KEY" (toJson .Values) -}}
{{- fail "provider API_KEY configuration is not accepted in this BYOK chart" -}}
{{- end -}}
{{- if not (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version) -}}
{{- fail "Kubernetes >=1.30 is required; verify a currently maintained regional VKE release" -}}
{{- end -}}
{{- if not .Values.prerequisitesConfirmed -}}
{{- fail "prerequisitesConfirmed=true requires CCM, two Ready nodes with surge capacity, identity/TLS Secrets, DNS/TLS and HPA metrics API checks" -}}
{{- end -}}
{{- if eq .Values.identitySecret.name .Values.tlsSecretName -}}
{{- fail "identity and TLS must use different existing Secrets" -}}
{{- end -}}
{{- if .Values.temporaryUpload.enabled -}}
{{- if or (empty .Values.temporaryUpload.existingSecret) (eq .Values.temporaryUpload.existingSecret .Values.identitySecret.name) (eq .Values.temporaryUpload.existingSecret .Values.tlsSecretName) -}}
{{- fail "temporary uploads require a distinct existing TOS/enrollment Secret" -}}
{{- end -}}
{{- end -}}
{{- if eq .Values.temporaryUpload.credentialsMode "irsa" -}}
{{- if or (not .Values.temporaryUpload.enabled) (not .Values.temporaryUpload.irsa.prerequisitesConfirmed) (empty .Values.temporaryUpload.irsa.serviceAccountName) (eq .Values.temporaryUpload.irsa.serviceAccountName "default") (empty .Values.temporaryUpload.irsa.roleTrn) -}}
{{- fail "IRSA requires enabled uploads, explicit ServiceAccount/role and verified cluster/trust/STS prerequisites" -}}
{{- end -}}
{{- else if or (not (empty .Values.temporaryUpload.irsa.serviceAccountName)) (not (empty .Values.temporaryUpload.irsa.roleTrn)) .Values.temporaryUpload.irsa.prerequisitesConfirmed -}}
{{- fail "IRSA configuration requires temporaryUpload.credentialsMode=irsa" -}}
{{- end -}}
{{- if eq .Values.identitySecret.hmacKey .Values.identitySecret.versionKey -}}
{{- fail "identity HMAC and version must use distinct Secret keys" -}}
{{- end -}}
{{- if gt .Values.autoscaling.minReplicas .Values.autoscaling.maxReplicas -}}
{{- fail "autoscaling minimum must not exceed maximum replicas" -}}
{{- end -}}
{{- range $resources := .Values.resources -}}
{{- if or (gt $resources.cpuRequestMillis $resources.cpuLimitMillis) (gt $resources.memoryRequestMiB $resources.memoryLimitMiB) -}}
{{- fail "resource requests must not exceed limits" -}}
{{- end -}}
{{- end -}}
{{- $defaults := dict "seedream" "dola-seedream-5-5-261028" "seedance" "dreamina-seedance-2-5-260628" -}}
{{- range $product, $selection := .Values.models -}}
{{- $seen := dict -}}
{{- range $binding := $selection.bindings -}}
{{- if hasKey $seen $binding.model_id -}}
{{- fail "model bindings must have unique IDs within each product" -}}
{{- end -}}
{{- $_ := set $seen $binding.model_id true -}}
{{- end -}}
{{- if gt (len $selection.bindings) 0 -}}
{{- if not (hasKey $seen $selection.defaultModel) -}}
{{- fail "model bindings must include the selected product default" -}}
{{- end -}}
{{- else if ne $selection.defaultModel (get $defaults $product) -}}
{{- fail "alternate model defaults require explicit verified bindings" -}}
{{- end -}}
{{- end -}}

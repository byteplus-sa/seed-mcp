apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ include "seed-mcp.name" . }}-state
  labels:
    {{- include "seed-mcp.selector" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
provisioner: ebs.csi.volcengine.com
parameters:
  ChargeType: PostPaid
  fsType: ext4
  type: ESSD_PL0
  zone: {{ .Values.storage.zone | quote }}
  projectName: {{ .Values.storage.project | quote }}
  encrypted: {{ .Values.storage.encrypted | quote }}
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

# Hosted BYOK foundation: plans/PLAN_HOSTED_BYOK_FOUNDATION.md.
#
# One replica, fresh SQLite state. No old-state migration or HTTP job backend.
# Provider credentials and client secrets arrive only in caller headers.

name: ark-mcp

services:
  ark-mcp:
    image: ${ARK_MCP_IMAGE:-ark-mcp:latest}
    build:
      context: ../..
    restart: unless-stopped
    stop_grace_period: 660s
    deploy:
      replicas: 1
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3000"
      MCP_AUTH_MODE: byok
      MCP_IDENTITY_HMAC_KEY: ${MCP_IDENTITY_HMAC_KEY:?Set the operator HMAC key in .env}
      MCP_IDENTITY_KEY_VERSION: ${MCP_IDENTITY_KEY_VERSION:-1}
      MCP_ALLOWED_HOSTS: ${MCP_PUBLIC_HOST:?Set MCP_PUBLIC_HOST in .env},ark-mcp
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      RATE_LIMIT_TRUST_PROXY_HEADERS: "false"
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-0}
      MCP_HTTP_MAX_IN_FLIGHT: ${MCP_HTTP_MAX_IN_FLIGHT:-64}
      MCP_HTTP_MAX_BODY_BYTES: ${MCP_HTTP_MAX_BODY_BYTES:-2097152}
      STATE_BACKEND: sqlite
      STATE_MAX_RECORDS: ${STATE_MAX_RECORDS:-100000}
      STATE_PRUNE_MAX_AGE_DAYS: ${STATE_PRUNE_MAX_AGE_DAYS:-30}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-25}
      PROVIDER_MAX_CONCURRENCY: ${PROVIDER_MAX_CONCURRENCY:-5}
      PRINCIPAL_MAX_CONCURRENCY: ${PRINCIPAL_MAX_CONCURRENCY:-3}
      BYTEPLUS_OMNIHUMAN_ENABLED: ${BYTEPLUS_OMNIHUMAN_ENABLED:-false}
      READINESS_CHECK_PROVIDERS: "false"
      ARTIFACT_BACKEND: filesystem
      ARTIFACT_DIR: /app/.artifacts
      ARK_LOG_LEVEL: ${ARK_LOG_LEVEL:-INFO}
    volumes:
      - byok-state:/app/.artifacts
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:?Set MCP_PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ark-mcp:
        condition: service_healthy
    networks:
      - edge

networks:
  edge: {}

volumes:
  byok-state: {}
  caddy-data: {}
  caddy-config: {}

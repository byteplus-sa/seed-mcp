name: BytePlus VKE

on:
  pull_request:
    paths:
      - "deploy/terraform/**"
      - "deploy/helm/**"
      - "scripts/generate_identity_secret.py"
      - "scripts/prepare_vke_terraform.py"
      - "tests/unit/test_vke*.py"
      - "tests/unit/test_prepare_vke_terraform.py"
      - "src/ark_mcp/providers/tos/**"
      - "src/ark_mcp/config/env.py"
      - "src/ark_mcp/tools/media_prepare_upload.py"
      - "src/ark_mcp/runtime.py"
      - "tests/unit/test_tos_irsa.py"
      - "tests/integration/test_tos_irsa.py"
      - "tests/unit/test_hosted_byok_deployment.py"
      - "tests/unit/test_generate_identity_secret.py"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "deploy/terraform/**"
      - "deploy/helm/**"
      - "scripts/generate_identity_secret.py"
      - "scripts/prepare_vke_terraform.py"
      - "tests/unit/test_vke*.py"
      - "tests/unit/test_prepare_vke_terraform.py"
      - "src/ark_mcp/providers/tos/**"
      - "src/ark_mcp/config/env.py"
      - "src/ark_mcp/tools/media_prepare_upload.py"
      - "src/ark_mcp/runtime.py"
      - "tests/unit/test_tos_irsa.py"
      - "tests/integration/test_tos_irsa.py"
      - "tests/unit/test_hosted_byok_deployment.py"
      - "tests/unit/test_generate_identity_secret.py"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.17.1"
  TF_SHA256: "4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061"
  HELM_VERSION: "4.3.2"
  HELM_SHA256: "d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983" # pragma: allowlist secret

jobs:
  validate:
    name: Offline VKE plans and Helm contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.11.26"
          python-version: "3.12"

      - name: Install checksum-verified Terraform
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          printf '%s  %s\n' "$TF_SHA256" "$RUNNER_TEMP/terraform.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/terraform-bin"
          printf '%s\n' "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"
          printf 'TF_DATA_DIR=%s/ark-terraform\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check Terraform and mocked plans
        run: |
          python3 scripts/prepare_vke_terraform.py validate

      - name: Install checksum-verified Helm
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/helm.tar.gz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$HELM_SHA256" "$RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"

      - name: Check Helm and private identity contracts
        run: |
          uv sync --locked
          helm lint deploy/helm/seed-mcp -f deploy/helm/seed-mcp/values.ci.yaml --strict
          helm template seed-mcp deploy/helm/seed-mcp -f deploy/helm/seed-mcp/values.ci.yaml > "$RUNNER_TEMP/seed-mcp.yaml"
          uv run mypy scripts/generate_identity_secret.py scripts/prepare_vke_terraform.py
          uv run pytest tests/unit/test_vke*.py tests/unit/test_hosted_byok_deployment.py tests/unit/test_generate_identity_secret.py tests/unit/test_prepare_vke_terraform.py tests/unit/test_tos_irsa.py tests/integration/test_tos_irsa.py --disable-socket --allow-unix-socket

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for release publication
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.26"
  HELM_VERSION: "4.3.2"
  HELM_SHA256: "d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983" # pragma: allowlist secret
  CADDY_VERSION: "2.11.9"
  CADDY_SHA256: "5b8cb7faf8726a2028ad96a66e54e6e81e8f361bc6175e5d22bbd997cc5177fb" # pragma: allowlist secret

jobs:
  quality:
    name: Quality, security, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify lockfile and install
        run: |
          uv lock --check
          uv sync --locked
          uv run python scripts/release_checks.py

      - name: Install checksum-verified validation tools
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/helm.tar.gz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$HELM_SHA256" "$RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/caddy.tar.gz" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$CADDY_SHA256" "$RUNNER_TEMP/caddy.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/caddy-bin"
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP/caddy-bin" caddy
          printf 'CADDY_BIN=%s/caddy-bin/caddy\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Lint and format check
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Type check
        run: make typecheck

      - name: Offline tests with coverage
        run: uv run pytest --disable-socket --allow-unix-socket --cov=ark_mcp --cov-report=term-missing

      - name: Mock-provider HTTPS acceptance and bounded load
        run: uv run python scripts/hosted_acceptance.py --caddy-bin "$CADDY_BIN"

      - name: Static security scan
        run: uv run bandit -q -r src/ark_mcp

      - name: Dependency vulnerability audit
        run: bash scripts/audit_dependencies.sh

      - name: Secret scan
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --no-verify --baseline .secrets.baseline

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test installed wheel
        run: |
          uv venv /tmp/ark-wheel-smoke
          uv pip install --python /tmp/ark-wheel-smoke/bin/python dist/*.whl
          /tmp/ark-wheel-smoke/bin/python -c "import ark_mcp; assert ark_mcp.create_server"

  container:
    name: Container build and health
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Build image
        run: docker build --tag ark-mcp:ci .

      - name: Exercise health endpoint
        run: |
          export MCP_IDENTITY_HMAC_KEY="$(openssl rand -hex 32)"
          docker run --detach --rm --name ark-mcp-ci \
            --publish 127.0.0.1:3000:3000 \
            --env MCP_IDENTITY_HMAC_KEY \
            ark-mcp:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              status="$(curl --silent --output /tmp/seed-mcp-discovery.json --write-out '%{http_code}' \
                --request POST \
                --header 'Content-Type: application/json' \
                --header 'Accept: application/json, text/event-stream' \
                --header 'Mcp-Protocol-Version: 2026-07-28' \
                --header 'Mcp-Method: tools/list' \
                --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
                http://127.0.0.1:3000/mcp)"
              test "$status" = "200"
              jq -e '.result.tools | length == 7' /tmp/seed-mcp-discovery.json
              curl --fail --silent --request POST \
                --header 'Content-Type: application/json' \
                --header 'Accept: application/json, text/event-stream' \
                --header 'Mcp-Protocol-Version: 2026-07-28' \
                --header 'Mcp-Method: tools/call' \
                --header 'Mcp-Name: seedance_create_task' \
                --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"seedance_create_task","arguments":{"input":{"prompt":"Offline smoke","dry_run":true}},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
                http://127.0.0.1:3000/mcp | jq -e '.result.isError == true'
              exit 0
            fi
            sleep 1
          done
          docker logs ark-mcp-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop ark-mcp-ci || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:edge
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
